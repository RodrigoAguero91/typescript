<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Login</title>
    <link rel="stylesheet" href="/src/css/styles.css">
</head>
<body>
    <main class="auth-container">
        <h2>Iniciar Sesión</h2>
        <form id="form-login">
            <div class="form-group">
                <label for="login-email">Correo Electrónico:</label>
                <input type="email" id="login-email" required placeholder="ejemplo@correo.com">
            </div>
            
            <div class="form-group">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password" required placeholder="********">
            </div>

            <button type="submit">Ingresar</button>
        </form>
        <p>¿No tenés cuenta? <a href="/src/pages/auth/registro/registro.html">Registrate acá</a></p>
    </main>

   <script type="module" src="/src/pages/auth/login/login.ts"></script>
</body>
</html>
