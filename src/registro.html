<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Registro</title>
    <link rel="stylesheet" href="/src/css/styles.css">
</head>
<body>
    <main class="auth-container">
        <h2>Crear Cuenta</h2>
        <form id="form-registro">
            <div class="form-group">
                <label for="reg-email">Correo Electrónico:</label>
                <input type="email" id="reg-email" required placeholder="ejemplo@correo.com">
            </div>
            
            <div class="form-group">
                <label for="reg-password">Contraseña:</label>
                <input type="password" id="reg-password" required placeholder="********">
            </div>

            <button type="submit">Registrarse</button>
        </form>
        <p>¿Ya tenés cuenta? <a href="/src/pages/auth/login/login.html">Iniciá sesión acá</a></p>
    </main>

    <script type="module" src="/src/pages/auth/registro/registro.ts"></script>
</body>
</html>
